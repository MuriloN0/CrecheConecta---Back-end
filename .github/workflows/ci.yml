# Pipeline de integracao continua do CrecheConecta (back-end).
# Roda a cada Pull Request para a main, em ambiente limpo, com 3 checagens independentes em paralelo.
name: CI

on:
  pull_request:
    branches: [main]

# Permissao minima: o workflow so precisa ler o codigo
permissions:
  contents: read

# Um novo push no mesmo PR cancela a execucao anterior, que ficou desatualizada
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  testes-unitarios:
    name: Testes unitários
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Configurar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Somente os testes SEM a tag "integration" (Mockito / Java puro, sem Spring, banco ou rede)
      - name: Executar testes unitários
        run: ./mvnw -B test -DexcludedGroups=integration

  testes-integracao:
    name: Testes de integração
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Configurar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Somente os testes COM a tag "integration" (API, service e H2 em memória, perfil "test")
      - name: Executar testes de integração
        run: ./mvnw -B test -Dgroups=integration

  linter:
    name: Linter
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Configurar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Checkstyle com as regras versionadas em checkstyle.xml; qualquer violação reprova o job
      - name: Executar Checkstyle
        run: ./mvnw -B checkstyle:check
