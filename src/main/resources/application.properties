spring.application.name=crecheconecta

saude.criptografia.chave=${SAUDE_CRIPTOGRAFIA_CHAVE}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true

server.error.include-message=never
server.error.include-stacktrace=never

app.seguranca.hmac-chave-base64=${AUTH_HMAC_KEY_BASE64}

app.email.resend.api-key=${RESEND_API_KEY}
app.email.resend.remetente=${RESEND_FROM}

app.cadastro.url=${CADASTRO_URL}
app.cadastro.direcao.url=${CADASTRO_DIRECAO_URL}
app.cadastro.responsavel.url=${CADASTRO_RESPONSAVEL_URL}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}