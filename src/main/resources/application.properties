spring.application.name=crecheconecta

# Segredos vêm de variáveis de ambiente (Render) ou do application-local.properties (máquina local).
# Sem valor padrão de propósito: se faltar, o app não sobe.
saude.criptografia.chave=${SAUDE_CRIPTOGRAFIA_CHAVE}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/crecheconecta}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true

server.error.include-message=never
server.error.include-stacktrace=never

app.seguranca.hmac-chave-base64=${AUTH_HMAC_KEY_BASE64}

app.email.resend.api-key=${RESEND_API_KEY}
app.email.resend.remetente=${RESEND_FROM}

app.cadastro.url=${CADASTRO_URL:http://localhost:4200/cadastro}
app.cadastro.direcao.url=${CADASTRO_DIRECAO_URL:http://localhost:4200/cadastro/direcao}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
