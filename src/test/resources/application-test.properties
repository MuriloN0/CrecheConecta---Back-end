# Perfil de TESTE (ativado por @ActiveProfiles("test")).
# Banco H2 em memoria, descartavel: cada execucao comeca do zero.
# Nao afeta o ambiente de desenvolvimento (que usa PostgreSQL).

spring.datasource.url=jdbc:h2:mem:crecheconecta_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# O Hibernate cria o schema a partir das entidades (nao usamos as migrations
# Flyway aqui, pois elas sao escritas para PostgreSQL).
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=false

# Chaves fake, exclusivas para os testes (apenas para o contexto subir).
# A criptografia usa AES-256 (base64 de 32 bytes). As demais sao exigidas
# por outros modulos (seguranca/e-mail) quando a aplicacao inteira sobe.
saude.criptografia.chave=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
app.seguranca.hmac-chave-base64=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
app.email.resend.api-key=re_teste_fake_key_123
app.email.resend.remetente=teste@teste.com
